name: Bug report
description: Report a reproducible problem in the GodSDK scaffold or CLI.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For security issues, follow [SECURITY.md](../../SECURITY.md) instead of opening a public issue.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and the behavior you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the command, platform, Rust version, and smallest useful example.
    validations:
      required: true
