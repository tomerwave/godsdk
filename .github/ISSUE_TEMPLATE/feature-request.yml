name: Feature request
description: Propose a focused improvement to GodSDK.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and use case
      description: What user or contributor problem would this solve?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope
      description: Explain whether this belongs to ingestion, IR, generation, bindings, or repository tooling.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe other approaches and their trade-offs.
