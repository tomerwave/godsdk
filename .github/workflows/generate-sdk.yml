name: Generate SDK

on:
  workflow_call:
    inputs:
      spec-path:
        required: false
        type: string
      spec-url:
        required: false
        type: string
      spec-sha256:
        required: false
        type: string
      targets:
        required: false
        default: rust,typescript
        type: string
      remote-ref-hosts:
        required: false
        type: string
      remote-ref-pins:
        required: false
        type: string
      generator-version:
        required: false
        default: 0.1.2
        type: string
      godlint-version:
        required: false
        default: 0.7.0
        type: string
      godharness-version:
        required: false
        default: 0.1.6
        type: string
      output:
        required: false
        default: .
        type: string
      mode:
        required: false
        default: dry-run
        type: string
      prune:
        required: false
        default: false
        type: boolean
      commit:
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      spec-path:
        required: false
        type: string
      spec-url:
        required: false
        type: string
      spec-sha256:
        required: false
        type: string
      targets:
        required: true
        default: rust,typescript
        type: string
      output:
        required: true
        default: .
        type: string
      mode:
        required: true
        default: dry-run
        type: choice
        options: [write, dry-run, check]
      remote-ref-hosts:
        required: false
        type: string
      remote-ref-pins:
        required: false
        type: string
      generator-version:
        required: false
        default: 0.1.2
        type: string
      godlint-version:
        required: false
        default: 0.7.0
        type: string
      godharness-version:
        required: false
        default: 0.1.6
        type: string
      prune:
        required: true
        default: false
        type: boolean
      commit:
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: tomerwave/godsdk@d50d7166003259bdd270a7486bcf7a424a099d88 # v0.1.2
        with:
          spec-path: ${{ inputs.spec-path }}
          spec-url: ${{ inputs.spec-url }}
          spec-sha256: ${{ inputs.spec-sha256 }}
          targets: ${{ inputs.targets }}
          remote-ref-hosts: ${{ inputs.remote-ref-hosts }}
          remote-ref-pins: ${{ inputs.remote-ref-pins }}
          generator-version: ${{ inputs.generator-version }}
          output: ${{ inputs.output }}
          mode: ${{ inputs.mode }}
          prune: ${{ inputs.prune }}
      - name: Run Godlint on generated repository
        uses: tomerwave/godlint@c8b7fbf11b0bf26dd4e23db30ec54f708f7391fe # v0.7.0
        with:
          version: ${{ inputs.godlint-version }}
          working-directory: ${{ inputs.output }}
          summary: true
      - name: Install Godharness
        env:
          VERSION: ${{ inputs.godharness-version }}
        shell: bash
        run: |
          set -euo pipefail
          asset="godharness-x86_64-unknown-linux-gnu.tar.gz"
          directory="$RUNNER_TEMP/godharness"
          mkdir -p "$directory"
          gh release download "v$VERSION" --repo tomerwave/godharness --pattern "$asset*" --dir "$directory"
          (cd "$directory" && sha256sum --check "$asset.sha256")
          tar -xzf "$directory/$asset" -C "$directory"
          echo "$directory" >> "$GITHUB_PATH"
      - name: Run Godharness on generated repository
        working-directory: ${{ inputs.output }}
        run: godharness check
      - uses: actions/upload-artifact@v4
        with:
          name: godsdk-generated
          path: ${{ inputs.output }}
      - name: Report commit mode boundary
        if: inputs.commit == true
        run: echo "Generation preview completed; the authorized commit job will rerun the pinned generator."

  commit:
    if: inputs.commit == true
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: tomerwave/godsdk@d50d7166003259bdd270a7486bcf7a424a099d88 # v0.1.2
        with:
          spec-path: ${{ inputs.spec-path }}
          spec-url: ${{ inputs.spec-url }}
          spec-sha256: ${{ inputs.spec-sha256 }}
          targets: ${{ inputs.targets }}
          remote-ref-hosts: ${{ inputs.remote-ref-hosts }}
          remote-ref-pins: ${{ inputs.remote-ref-pins }}
          generator-version: ${{ inputs.generator-version }}
          output: ${{ inputs.output }}
          mode: write
          prune: ${{ inputs.prune }}
      - name: Run Godlint before commit
        uses: tomerwave/godlint@c8b7fbf11b0bf26dd4e23db30ec54f708f7391fe # v0.7.0
        with:
          version: ${{ inputs.godlint-version }}
          working-directory: ${{ inputs.output }}
          summary: true
      - name: Install Godharness before commit
        env:
          VERSION: ${{ inputs.godharness-version }}
        shell: bash
        run: |
          set -euo pipefail
          asset="godharness-x86_64-unknown-linux-gnu.tar.gz"
          directory="$RUNNER_TEMP/godharness"
          mkdir -p "$directory"
          gh release download "v$VERSION" --repo tomerwave/godharness --pattern "$asset*" --dir "$directory"
          (cd "$directory" && sha256sum --check "$asset.sha256")
          tar -xzf "$directory/$asset" -C "$directory"
          echo "$directory" >> "$GITHUB_PATH"
      - name: Run Godharness before commit
        working-directory: ${{ inputs.output }}
        run: godharness check
      - name: Commit generated changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet || (git commit -m "chore: update generated SDK" && git push)
