name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the CLI release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Verify tag matches Cargo metadata
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(cargo +1.97.1 metadata --no-deps --format-version 1 | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          test "${TAG#v}" = "$version"

      - name: Build release binary
        run: cargo +1.97.1 build --release --locked -p godsdk-cli

      - name: Package release
        run: |
          install -m 755 target/release/godsdk godsdk
          tar -czf "godsdk-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz" godsdk LICENSE README.md
          sha256sum "godsdk-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz" > "godsdk-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz.sha256"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            godsdk-*.tar.gz godsdk-*.sha256
