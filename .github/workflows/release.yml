name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  agree:
    name: Check the tag agrees with the release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Require the tag to match godsdk-cli metadata
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; print(next(package["version"] for package in json.load(sys.stdin)["packages"] if package["name"] == "godsdk-cli"))')"
          test "${TAG#v}" = "$version"

      - name: Test the release formula renderer
        run: PYTHONPATH=scripts/tests:scripts python3 -m unittest scripts/tests/test_build_homebrew_formula.py

  binaries:
    name: Build ${{ matrix.target }}
    needs: agree
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
            runnable: true
          - target: x86_64-apple-darwin
            runner: macos-latest
            runnable: false
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            runnable: true
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            runnable: true
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            runnable: true
            musl: true
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            runnable: true
            musl: true
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            runnable: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Install target
        run: rustup target add ${{ matrix.target }} --toolchain 1.97.1

      - name: Install musl toolchain
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build CLI
        run: cargo +1.97.1 build --release --locked -p godsdk-cli --target ${{ matrix.target }}

      - name: Prove the binary reports its release version
        if: matrix.runnable
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          suffix=""
          if [ "$RUNNER_OS" = "Windows" ]; then suffix=".exe"; fi
          printed="$(./target/${{ matrix.target }}/release/godsdk$suffix --version)"
          echo "$printed"
          printf '%s' "$printed" | grep -Fq "${TAG#v}"

      - name: Prove the musl binary is static
        if: matrix.musl
        run: |
          described="$(file "target/${{ matrix.target }}/release/godsdk")"
          echo "$described"
          printf '%s' "$described" | grep -q static

      - name: Package Unix archive
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          install -m 755 "target/$TARGET/release/godsdk" godsdk
          archive="godsdk-${version}-${TARGET}.tar.gz"
          tar -czf "$archive" godsdk LICENSE README.md
          sha256sum "$archive" > "$archive.sha256"

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG.TrimStart('v')
          Copy-Item "target/$env:TARGET/release/godsdk.exe" godsdk.exe
          $archive = "godsdk-$version-$env:TARGET.zip"
          Compress-Archive -Path godsdk.exe, LICENSE, README.md -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD/$archive.sha256", "$hash  $archive`n")

      - uses: actions/upload-artifact@v4
        with:
          name: godsdk-${{ matrix.target }}
          path: |
            godsdk-*.tar.gz*
            godsdk-*.zip*
          if-no-files-found: error

  publish:
    name: Publish Rust crates
    needs: binaries
    runs-on: ubuntu-latest
    environment: crates-io

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: cargo +1.97.1 publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  announce:
    name: Publish GitHub release
    needs: [publish, binaries]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: godsdk-*
          path: artifacts
          merge-multiple: true

      - name: Create or update release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" --title "$TAG" --generate-notes artifacts/*
          fi

      - name: Confirm every archive has been attached
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          expected="$(find artifacts -type f | wc -l | tr -d ' ')"
          attached="$(gh release view "$TAG" --json assets --jq '.assets | length')"
          test "$attached" -ge "$expected"

  homebrew:
    name: Update Homebrew tap
    needs: announce
    runs-on: ubuntu-latest
    environment: homebrew-tap

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: godsdk-*
          path: artifacts
          merge-multiple: true

      - name: Render and validate formula
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          python3 scripts/build_homebrew_formula.py "$version" --assets artifacts --out Godsdk.rb
          grep -Fq 'class Godsdk < Formula' Godsdk.rb

      - uses: actions/checkout@v4
        with:
          repository: tomerwave/homebrew-tap
          path: tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}

      - name: Update formula
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/update_homebrew_tap.sh "$TAG"
