[workspace]
members = [
  "crates/godsdk-cli",
  "crates/godsdk-core",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
authors = ["Tomer Gal"]
description = "A deterministic, Rust-based SDK generator."
license = "MIT"
repository = "https://github.com/tomerwave/godsdk"
keywords = ["sdk", "code-generation", "openapi", "rust"]
categories = ["command-line-utilities", "development-tools"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
expect_used = "warn"
todo = "warn"
unwrap_used = "warn"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml_serde = "0.10"
thiserror = "2"
