openapi: 3.1.0
info:
  title: Form URL Encoded Fixture API
  version: 1.0.0
servers:
  - url: https://example.test
paths:
  /search:
    post:
      operationId: search
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SearchForm'
      responses:
        '204':
          description: Search accepted
components:
  schemas:
    SearchForm:
      type: object
      required:
        - query
      properties:
        query:
          type: string
        page:
          type: integer
          format: int32
