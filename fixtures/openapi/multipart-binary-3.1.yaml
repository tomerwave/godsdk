openapi: 3.1.0
info:
  title: Media transport fixture API
  version: 1.0.0
paths:
  /uploads:
    post:
      operationId: uploadAsset
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadForm'
      responses:
        '201':
          description: Uploaded asset
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
components:
  schemas:
    UploadForm:
      type: object
      required: [name, file]
      properties:
        name: {type: string}
        file: {type: string, format: binary}
