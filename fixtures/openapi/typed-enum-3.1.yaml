openapi: 3.1.0
info:
  title: Typed enum regression
  version: 1.0.0
paths:
  /items:
    get:
      operationId: listItems
      parameters:
        - name: limit
          in: query
          schema:
            $ref: '#/components/schemas/Limit'
        - name: offset
          in: query
          schema:
            type: integer
            enum: [0, 10, 20]
      responses:
        '200':
          description: Items
components:
  schemas:
    Limit:
      type: integer
      enum: [10, 20, 50]
